<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>soulyap — grief sad-face options</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#0E0C13;--paper:#F3EEE8;--dim:#A29CAA;--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0E0C13;color:var(--paper);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 16px 48px}
  h1{font-family:var(--serif);font-weight:500;font-size:22px}
  .note{font-size:13px;color:var(--dim);max-width:560px;text-align:center;line-height:1.5}
  .note b{color:var(--paper)}
  .row{display:flex;gap:34px;flex-wrap:wrap;justify-content:center;margin-top:26px}
  .opt{display:flex;flex-direction:column;align-items:center;gap:11px;width:150px}
  .disc{width:108px;height:108px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ring)}
  .opt .cap{font-size:14px;font-weight:700}
  .opt .d{font-size:11.5px;color:var(--dim);text-align:center;line-height:1.4}
  .rec{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#0E0C13;background:#9BC47E;border-radius:999px;padding:2px 7px;margin-left:6px}
</style>
</head>
<body>
  <h1>Grief — which sad face?</h1>
  <p class="note">All gradient-glow, grief blue. The old one looked angry because the brows pointed <i>down</i> at the nose. These use <b>raised inner brows</b> + softer eyes. Tell me <b>A, B, or C</b>.</p>
  <div class="row" id="row"></div>

<script>
  const DROP="M0 -1.8 C1.3 -0.2 1.3 1.5 0 1.5 C-1.3 1.5 -1.3 -0.2 0 -1.8 Z";
  const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;};
  const P={c:'#7FA0FF',d:'#5A7FE8',l:'#DCE6FF',f:'#2F3E66'};

  const base=(g)=>`<circle cx="12" cy="12" r="7" fill="url(#${g})"/><ellipse cx="9.6" cy="8.4" rx="2.4" ry="1.4" fill="#fff" opacity=".16" transform="rotate(-18 9.6 8.4)"/>`;

  const FACES={
    A:(g)=>base(g)+`
      <path d="M8.2 9.8 Q9.5 8.4 10.9 8.9" stroke="${P.f}" stroke-width="1" fill="none" stroke-linecap="round"/>
      <path d="M15.8 9.8 Q14.5 8.4 13.1 8.9" stroke="${P.f}" stroke-width="1" fill="none" stroke-linecap="round"/>
      <circle cx="9.7" cy="12" r="1.05" fill="${P.f}"/><circle cx="14.3" cy="12" r="1.05" fill="${P.f}"/>
      <circle cx="9.4" cy="11.7" r=".3" fill="#fff" opacity=".85"/><circle cx="14" cy="11.7" r=".3" fill="#fff" opacity=".85"/>
      <path d="M9.5 15.9 Q12 13.9 14.5 15.9" stroke="${P.f}" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <g transform="translate(9.4 13.7) scale(.72)" fill="${P.l}"><path d="${DROP}"/></g>`,
    B:(g)=>base(g)+`
      <path d="M8.4 9.7 Q9.6 8.9 10.8 9.3" stroke="${P.f}" stroke-width=".9" fill="none" stroke-linecap="round"/>
      <path d="M15.6 9.7 Q14.4 8.9 13.2 9.3" stroke="${P.f}" stroke-width=".9" fill="none" stroke-linecap="round"/>
      <path d="M8.3 11.3 Q9.7 12.7 11.1 11.3" stroke="${P.f}" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <path d="M12.9 11.3 Q14.3 12.7 15.7 11.3" stroke="${P.f}" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <path d="M9.6 15.8 Q12 14.1 14.4 15.8" stroke="${P.f}" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <g transform="translate(9 13.7) scale(.6)" fill="${P.l}"><path d="${DROP}"/></g>
      <g transform="translate(15 13.7) scale(.6)" fill="${P.l}"><path d="${DROP}"/></g>`,
    C:(g)=>base(g)+`
      <ellipse cx="9.7" cy="11.9" rx=".9" ry="1.05" fill="${P.f}"/><ellipse cx="14.3" cy="11.9" rx=".9" ry="1.05" fill="${P.f}"/>
      <circle cx="9.4" cy="11.6" r=".28" fill="#fff" opacity=".85"/><circle cx="14" cy="11.6" r=".28" fill="#fff" opacity=".85"/>
      <path d="M10 15.5 Q12 14.5 14 15.5" stroke="${P.f}" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <g transform="translate(9.5 13.7) scale(.75)" fill="${P.l}"><path d="${DROP}"/></g>`,
  };

  const OPTS=[
    ['A','Pleading',   'open eyes, raised inner brows, soft frown + one tear'],
    ['B','Quiet cry',  'closed teary eyes, soft frown + two tears — reads most clearly “sad”', true],
    ['C','Understated','calm eyes, faint frown, a single tear — most subtle'],
  ];
  const glowBed=`radial-gradient(circle at 50% 42%, ${hexA(P.c,.34)}, ${hexA(P.c,.06)} 72%)`;
  const row=document.getElementById('row');
  OPTS.forEach(([k,name,desc,rec])=>{
    const g='grief'+k;
    const defs=`<linearGradient id="${g}" x1="0" y1="0" x2=".35" y2="1"><stop offset="0%" stop-color="${P.l}"/><stop offset="55%" stop-color="${P.c}"/><stop offset="100%" stop-color="${P.d}"/></linearGradient>`;
    const el=document.createElement('div');el.className='opt';el.style.setProperty('--ring',hexA(P.c,.25));
    el.innerHTML=`<div class="disc" style="background:${glowBed}"><svg width="74" height="74" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${FACES[k](g)}</svg></div>
      <div class="cap">${k} · ${name}${rec?'<span class="rec">rec</span>':''}</div><div class="d">${desc}</div>`;
    row.appendChild(el);
  });
</script>
</body>
</html>
